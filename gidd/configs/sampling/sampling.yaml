position_metric: MDM_max # [MDM_max, MDM_margin, MDM_margin_relative, max, margin]
position_sampling_strategy: top_k_gumbel # [independent, all, top_k_gumbel, top_k, top_p, min_p]
position_sampling_strategy_args:
  top_k_gumbel:
    k: 2
    gumbel_noise_coefficient: 0.0
  top_k: 8
  top_p: 0.9
  min_p: 0.05
token_sampling_strategy: MDM_categorical # [MDM_categorical, categorical, top_k, top_p, min_p]
token_sampling_strategy_args:
  top_k: 10
  top_p: 0.9
  min_p: 0.05