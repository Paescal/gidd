defaults:
  - logging: default
  # - data: owt
  # - model: small
  - data: sudoku
  - model: 6M
  - optimizer: adam
  - sampling: training_sampling
  - _self_

model:
  type: diffusion
  diffusion_process: gidd
  p_uniform: 0.1
  t_eps: 1e-4

training:
  resume: null
  seed: 1
  train_batch_size: 64
  eval_batch_size: 64
  score_batch_size: 64
  # num_train_steps: 1 epoch = 1_889_993 / 64 = 29_532
  num_train_steps: 118_128 # 236_256 # 118_128
  lr_schedule: cosine
  warmup_steps: 10_000 #10000
  low_discrepancy_sampling: True
  dtype: bf16
  compile_model: False #True

loss:
  loss_type: gidd
  loss_weighting: dynamic  # [dynamic, clip, none]
  min_loss_weight: 0.0
  max_loss_weight: 1.0
  loss_scale: 1.0
  reduction: tokenmean
